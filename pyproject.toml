[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantallm"
dynamic = ["version"]
description = "A from-scratch decoder-only MoE transformer for LLM pretraining research."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Aaron Chakraborty" }]
keywords = ["transformer", "moe", "llm", "pretraining", "deepspeed", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# NOTE: torch is intentionally NOT listed here — install the wheel matching your
# target (CUDA vs CPU) from the PyTorch index first. See README.md / requirements.txt.
# `datasets` (data-pipeline only) lives in the optional [project.optional-dependencies].
dependencies = [
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "pydantic==2.13.3",
    "tokenizers==0.22.2",
    "requests==2.33.1",
    "numpy==2.4.4",
    "pandas==3.0.2",
    "ipykernel==7.2.0",
    "wrapt==2.1.2",
    "safetensors==0.7.0",
    "ninja==1.13.0",
    "deepspeed==0.19.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
data = ["datasets==4.8.5"]

[project.urls]
Homepage = "https://github.com/aaron-631/VantaLLM"
Repository = "https://github.com/aaron-631/VantaLLM"

[tool.setuptools]
# Ship the importable package plus the top-level helper modules the trainer imports.
py-modules = ["verify_gpu_ready", "verify_distributed"]

[tool.setuptools.packages.find]
include = ["vantallm*"]

[tool.setuptools.dynamic]
version = { attr = "vantallm.__version__" }
